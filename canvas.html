<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Collab Canvas</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#111114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #111114;
      --toolbar-bg: #18181c;
      --border: #27272a;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --hover: #27272a;
      --active: #3b82f6;
      --danger: #ef4444;
      --radius: 6px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      font-family: var(--font);
      display: flex;
      height: 100vh;
      color: var(--text);
      font-size: 13px;
      user-select: none;
      overflow: hidden;
    }

    .sidebar {
      width: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
      background: var(--toolbar-bg);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }

    .tool-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
      width: 48px;
      flex-shrink: 0;
    }

    .sep-v {
      width: 24px;
      height: 1px;
      background: var(--border);
      flex-shrink: 0;
      margin: 0;
      opacity: .4;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }

    .tool-btn svg { width: 18px; height: 18px; }
    .tool-btn:hover { background: var(--hover); color: var(--text); }

    .tool-btn.active {
      background: var(--active);
      color: #fff;
    }
    .tool-btn.danger:hover { background: var(--danger); color: #fff; }

    .tool-btn .shortcut {
      display: none;
      position: absolute;
      left: 100%;
      top: 50%;
      transform: translateY(-50%);
      margin-left: 6px;
      background: #222;
      color: #aaa;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      border: 1px solid var(--border);
    }
    .tool-btn:hover .shortcut { display: block; }

    .sidebar-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      margin-top: auto;
      padding: 6px 0;
      width: 100%;
      border-top: 1px solid var(--border);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background .3s;
      flex-shrink: 0;
    }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.4); }
    .status-dot.offline { background: #555; }

    .status-text { color: var(--text-muted); font-size: 9px; text-align: center; line-height: 1.2; }
    .status-count { color: var(--text-muted); font-size: 8px; text-align: center; }

    .bottom-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--toolbar-bg);
      border-top: 1px solid var(--border);
      height: 40px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }
    .bottom-bar::-webkit-scrollbar { display: none; }

    .bottom-bar .sep {
      width: 1px;
      height: 22px;
      background: var(--border);
      flex-shrink: 0;
    }

    .opt-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .opt-group label {
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    input[type="color"] {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      background: none;
      padding: 1px;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }

    input[type="range"] {
      width: 50px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--active);
      cursor: pointer;
      border: 2px solid var(--toolbar-bg);
      box-shadow: 0 0 4px rgba(0,0,0,.4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--active);
      cursor: pointer;
      border: 2px solid var(--toolbar-bg);
    }

    .value-badge {
      color: var(--text);
      font-size: 10px;
      font-weight: 500;
      min-width: 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .swatches {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .swatch {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all .15s;
      flex-shrink: 0;
    }
    .swatch:hover { transform: scale(1.2); }
    .swatch.active { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,.2); }

    .size-preview {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .size-preview-dot {
      border-radius: 50%;
      background: var(--text);
      transition: width .1s, height .1s;
    }


    .canvas-wrap {
      flex: 1;
      display: flex;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    .canvas-wrap canvas {
      cursor: crosshair;
      background: #fff;
      image-rendering: auto;
      touch-action: none;
      width: 100%;
      height: 100%;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .room-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(24,24,28,.85);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 10px;
      cursor: pointer;
      transition: all .15s;
      backdrop-filter: blur(6px);
    }
    .room-badge:hover { background: rgba(36,36,42,.9); border-color: var(--text-muted); }
    .room-badge svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
    .room-badge span {
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
    }
    .room-badge .copied-msg {
      color: var(--active);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0;
    }

    @media (orientation: landscape) and (max-width: 900px) {
      .sidebar { width: 44px; }
      .tool-group { width: 40px; padding: 3px 0; }
      .tool-btn { width: 30px; height: 30px; }
      .tool-btn svg { width: 15px; height: 15px; }
      .sep-v { width: 20px; }
      .bottom-bar { height: auto; min-height: 38px; padding: 4px 8px; padding-bottom: calc(4px + constant(safe-area-inset-bottom, 0px)); padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); gap: 4px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
      .opt-group label { font-size: 8px; }
      input[type="color"] { width: 20px; height: 20px; }
      input[type="range"] { width: 36px; }
      .value-badge { font-size: 9px; min-width: 18px; }
      .swatches { display: none; }
      .canvas-wrap { padding-bottom: max(38px, calc(38px + constant(safe-area-inset-bottom, 0px))); padding-bottom: calc(38px + env(safe-area-inset-bottom, 0px)); }
      .status-text { font-size: 8px; }
      .opt-hide { display: none; }
      .room-badge { top: 6px; left: 6px; padding: 3px 8px; }
      .room-badge span { font-size: 11px; }
    }

    @media (orientation: portrait) and (max-width: 768px) {
      body { overflow: hidden; flex-direction: column; height: 100dvh; }
      .sidebar {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 4px 6px;
        gap: 3px;
        height: auto;
        min-height: 60px;
        max-height: 84px;
        overflow-y: auto;
        align-content: center;
        justify-content: center;
      }
      .tool-group { flex-direction: row; width: auto; padding: 2px 4px; gap: 3px; }
      .tool-group .tool-btn { width: 30px; height: 30px; }
      .tool-group .tool-btn svg { width: 15px; height: 15px; }
      .sep-v { width: 1px; height: 18px; margin: 0; opacity: .3; }
      .sidebar-status {
        flex-direction: row;
        margin-top: 0;
        border-top: none;
        padding: 2px 6px;
        width: auto;
        flex-shrink: 0;
      }
      .sidebar-status .status-text { font-size: 8px; }
      .sidebar-status .status-count { font-size: 7px; }
      .sidebar-status .status-dot { width: 5px; height: 5px; }
      .canvas-wrap { flex: 1; width: 100%; background: #000; }
      .canvas-wrap canvas { height: 100%; }
      .bottom-bar { height: auto; min-height: 44px; padding: 6px 8px; padding-bottom: calc(6px + constant(safe-area-inset-bottom, 0px)); padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); gap: 6px; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; }
      .bottom-bar .opt-group label { font-size: 10px; white-space: nowrap; }
      .bottom-bar input[type="color"] { width: 26px; height: 26px; }
      .bottom-bar input[type="range"] { width: 60px; }
      .bottom-bar .value-badge { font-size: 10px; min-width: 20px; }
      .bottom-bar .opt-hide { display: none; }
      .swatches { display: none; }
      .canvas-wrap { padding-bottom: max(44px, calc(44px + constant(safe-area-inset-bottom, 0px))); padding-bottom: calc(44px + env(safe-area-inset-bottom, 0px)); }
      .tool-btn .shortcut { display: none !important; }
      .room-badge { top: 4px; left: 4px; padding: 2px 6px; gap: 3px; }
      .room-badge span { font-size: 9px; letter-spacing: 1px; }
      .room-badge svg { width: 10px; height: 10px; }
    }
  </style>
</head>
<body>

  <div class="sidebar">

    <div class="tool-group">
      <button class="tool-btn" id="downloadBtn" title="Download PNG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="shortcut">Ctrl+S</span>
      </button>
      <button class="tool-btn danger" id="clearBtn" title="Clear canvas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span class="shortcut">Ctrl+Shift+C</span>
      </button>
    </div>

    <div class="sep-v"></div>

    <div class="tool-group">
      <button class="tool-btn active" data-tool="pencil" title="Pencil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        <span class="shortcut">1</span>
      </button>
      <button class="tool-btn" data-tool="brush" title="Brush">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l4 4 1.59-1.59a2 2 0 0 0 0-2.82L17 3.63a2 2 0 1 1 1.37 1Z"/><path d="M10 12 3 21.3a1 1 0 0 0 .7 1.7H14a2 2 0 0 0 2-2v-4"/></svg>
        <span class="shortcut">2</span>
      </button>
      <button class="tool-btn" data-tool="shading" title="Shading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9h-9V3Z" fill="currentColor" opacity=".3"/></svg>
        <span class="shortcut">3</span>
      </button>
      <button class="tool-btn" data-tool="marker" title="Marker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M12 4v8"/><path d="M8 8c0-2 2-4 4-4s4 2 4 4-2 4-4 6c-2-2-4-4-4-6Z" fill="currentColor"/></svg>
        <span class="shortcut">4</span>
      </button>
      <button class="tool-btn" data-tool="eraser" title="Eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L16.2 0l7.8 7.8L11 20.2"/><path d="m6.5 13.5 7-7"/></svg>
        <span class="shortcut">5</span>
      </button>
    </div>

    <div class="sep-v"></div>

    <div class="tool-group">
      <button class="tool-btn" data-tool="line" title="Line">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="20" x2="20" y2="4"/></svg>
        <span class="shortcut">6</span>
      </button>
      <button class="tool-btn" data-tool="rect" title="Rectangle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        <span class="shortcut">7</span>
      </button>
      <button class="tool-btn" data-tool="circle" title="Circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
        <span class="shortcut">8</span>
      </button>
      <button class="tool-btn" data-tool="arrow" title="Arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>
        <span class="shortcut">9</span>
      </button>
    </div>

    <div class="sep-v"></div>

    <div class="tool-group">
      <button class="tool-btn" data-tool="paint" title="Flood fill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/><path d="M5 5l14 14M19 5L5 19"/></svg>
        <span class="shortcut">0</span>
      </button>
      <button class="tool-btn" data-tool="eyedropper" title="Eyedropper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 22l1-1h3l9-9M18 4l1-1a2 2 0 1 1 2.8 2.8L10 17.5V21l-6 1"/><path d="m5 13 6 6"/></svg>
        <span class="shortcut">E</span>
      </button>
    </div>

    <div class="sep-v"></div>

    <div class="tool-group">
      <button class="tool-btn" id="undoBtn" title="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span class="shortcut">Ctrl+Z</span>
      </button>
      <button class="tool-btn" id="redoBtn" title="Redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span class="shortcut">Ctrl+Shift+Z</span>
      </button>
    </div>

    <div class="sidebar-status">
      <span class="status-dot offline" id="statusDot"></span>
      <span class="status-text" id="statusText">Connecting</span>
      <span class="status-count" id="statusCount"></span>
    </div>

  </div>

  <div style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="room-badge" id="roomBadge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span id="roomLabel"></span>
      </div>
      <canvas id="canvas"></canvas>
    </div>

    <div class="bottom-bar">

      <div class="opt-group">
        <label>Stroke</label>
        <input type="color" id="colorPicker" value="#000000">
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="sep"></div>

      <div class="opt-group">
        <label>Size</label>
        <div class="size-preview"><div class="size-preview-dot" id="sizeDot"></div></div>
        <input type="range" id="sizeRange" min="1" max="60" value="4">
        <span id="sizeLabel" class="value-badge">4</span>
      </div>

      <div class="sep opt-hide"></div>

      <div class="opt-group opt-hide">
        <label>Opacity</label>
        <input type="range" id="opacityRange" min="5" max="100" value="100">
        <span id="opacityLabel" class="value-badge">100%</span>
      </div>

      <div class="sep"></div>

      <div class="opt-group">
        <label style="color:#a78bfa">BG</label>
        <input type="color" id="bgPicker" value="#ffffff">
      </div>

    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('canvasWrap');

    const colorPicker = document.getElementById('colorPicker');
    const sizeRange = document.getElementById('sizeRange');
    const sizeLabel = document.getElementById('sizeLabel');
    const sizeDot = document.getElementById('sizeDot');
    const opacityRange = document.getElementById('opacityRange');
    const opacityLabel = document.getElementById('opacityLabel');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const statusCount = document.getElementById('statusCount');
    const toolBtns = document.querySelectorAll('[data-tool]');

    const clearBtn = document.getElementById('clearBtn');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    const swatchesEl = document.getElementById('swatches');
    const bgPicker = document.getElementById('bgPicker');
    canvas.style.background = bgPicker.value;
    const roomBadge = document.getElementById('roomBadge');
    const roomLabel = document.getElementById('roomLabel');

    const params = new URLSearchParams(location.search);
    const ROOM = params.get('room');
    if (!ROOM || !/^[A-Z0-9]{3}-[A-Z0-9]{3}-[A-Z0-9]{3}$/.test(ROOM)) {
      window.location.href = '/';
    }

    roomLabel.textContent = ROOM;

    roomBadge.addEventListener('click', () => {
      navigator.clipboard.writeText(ROOM).then(() => {
        roomLabel.className = 'copied-msg';
        roomLabel.textContent = 'Copied!';
        setTimeout(() => { roomLabel.className = ''; roomLabel.textContent = ROOM; }, 1500);
      });
    });

    const PALETTE = ['#000000','#ffffff','#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899','#14b8a6'];
    let tool = 'pencil';
    let color = '#000000';
    let size = 4;
    let opacity = 1;
    let drawing = false;
    let lastX, lastY;
    let currentPath = [];
    let paths = [];
    let redoStack = [];
    let shapeStart = null;
    let lastSegmentTime = 0;
    let lastBcastX = 0, lastBcastY = 0;
    const SEGMENT_THROTTLE = 8;

    const CANVAS_W = 1200;
    const CANVAS_H = 800;

    function setupCanvas() {
      canvas.width = CANVAS_W;
      canvas.height = CANVAS_H;
    }

    PALETTE.forEach(c => {
      const el = document.createElement('div');
      el.className = 'swatch' + (c === color ? ' active' : '');
      el.style.background = c;
      if (c === '#ffffff') el.style.borderColor = '#ccc';
      el.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        color = c; colorPicker.value = c;
      });
      swatchesEl.appendChild(el);
    });

    toolBtns.forEach(btn => {
      btn.addEventListener('click', () => selectTool(btn.dataset.tool));
    });

    function selectTool(t) {
      toolBtns.forEach(b => b.classList.remove('active'));
      const btn = document.querySelector(`[data-tool="${t}"]`);
      if (btn) btn.classList.add('active');
      tool = t;
      const cursors = { eraser: 'cell', eyedropper: 'default', paint: 'crosshair' };
      canvas.style.cursor = cursors[t] || 'crosshair';
    }

    colorPicker.addEventListener('input', e => {
      color = e.target.value;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    });

    sizeRange.addEventListener('input', e => {
      size = parseInt(e.target.value);
      sizeLabel.textContent = size;
      const dotSize = Math.min(size, 18);
      sizeDot.style.width = dotSize + 'px';
      sizeDot.style.height = dotSize + 'px';
    });

    opacityRange.addEventListener('input', e => {
      opacity = parseInt(e.target.value) / 100;
      opacityLabel.textContent = parseInt(e.target.value) + '%';
    });

    bgPicker.addEventListener('input', e => {
      canvas.style.background = e.target.value;
      broadcast({ type: 'bg', color: e.target.value });
    });

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      let cx, cy;
      if (e.touches && e.touches.length) {
        cx = e.touches[0].clientX; cy = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length) {
        cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY;
      } else {
        cx = e.clientX; cy = e.clientY;
      }
      return {
        x: (cx - rect.left) / rect.width * canvas.width,
        y: (cy - rect.top) / rect.height * canvas.height,
      };
    }

    function applyStroke(c, x1, y1, x2, y2, strokeColor, strokeSize, strokeOpacity) {
      c.beginPath();
      c.moveTo(x1, y1);
      c.lineTo(x2, y2);
      c.strokeStyle = strokeColor;
      c.lineWidth = strokeSize;
      c.globalAlpha = strokeOpacity;
      c.lineCap = 'round';
      c.lineJoin = 'round';
      c.stroke();
      c.globalAlpha = 1;
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return { r, g, b };
    }

    function floodFill(pos, useColor) {
      const c = useColor || color;
      const w = canvas.width, h = canvas.height;
      const img = ctx.getImageData(0, 0, w, h);
      const d = img.data;
      const idx = (Math.floor(pos.y) * w + Math.floor(pos.x)) * 4;
      const tr = d[idx], tg = d[idx+1], tb = d[idx+2], ta = d[idx+3];
      const fill = hexToRgb(c);
      if (tr === fill.r && tg === fill.g && tb === fill.b && ta === 255) return;
      const visited = new Uint8Array(w * h);
      const stack = [Math.floor(pos.x), Math.floor(pos.y)];
      while (stack.length) {
        const y = stack.pop(), x = stack.pop();
        if (x < 0 || x >= w || y < 0 || y >= h) continue;
        const pi = y * w + x;
        if (visited[pi]) continue;
        const pi4 = pi * 4;
        if (d[pi4] !== tr || d[pi4+1] !== tg || d[pi4+2] !== tb || d[pi4+3] !== ta) continue;
        visited[pi] = 1;
        d[pi4] = fill.r; d[pi4+1] = fill.g; d[pi4+2] = fill.b; d[pi4+3] = 255;
        stack.push(x+1, y, x-1, y, x, y+1, x, y-1);
      }
      ctx.putImageData(img, 0, 0);
      broadcast({ type: 'floodfill', x: pos.x, y: pos.y, color: c });
    }

    function startDraw(e) {
      const pos = getPos(e);
      if (tool === 'paint') { floodFill(pos); return; }
      if (tool === 'eyedropper') {
        const px = ctx.getImageData(Math.floor(pos.x), Math.floor(pos.y), 1, 1).data;
        let hex;
        if (px[3] < 128) {
          hex = bgPicker.value;
        } else {
          hex = '#' + [px[0],px[1],px[2]].map(v => v.toString(16).padStart(2,'0')).join('');
        }
        colorPicker.value = hex; color = hex;
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        return;
      }
      drawing = true;
      lastX = pos.x; lastY = pos.y;
      lastBcastX = pos.x; lastBcastY = pos.y;
      if (['line','rect','circle','arrow'].includes(tool)) {
        shapeStart = { x: pos.x, y: pos.y };
        savedCanvas = ctx.getImageData(0, 0, canvas.width, canvas.height);
        return;
      }
      currentPath = [{ x: pos.x, y: pos.y, color, size, opacity }];
    }

    let savedCanvas = null;

    function draw(e) {
      if (!drawing) return;
      const pos = getPos(e);
      const isEraser = tool === 'eraser';
      const sColor = isEraser ? '#ffffff' : color;
      const sSize = tool === 'pencil' ? size * 0.6 : tool === 'brush' ? size * 2.5 : tool === 'shading' ? size * 4 : tool === 'marker' ? size * 1.2 : size;
      const sOpacity = tool === 'pencil' ? opacity : tool === 'brush' ? opacity * 0.85 : tool === 'shading' ? opacity * 0.12 : tool === 'marker' ? opacity * 0.5 : opacity;

      if (['line','rect','circle','arrow'].includes(tool)) {
        ctx.putImageData(savedCanvas, 0, 0);
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.globalAlpha = opacity;

        if (tool === 'line') {
          ctx.moveTo(shapeStart.x, shapeStart.y);
          ctx.lineTo(pos.x, pos.y);
        } else if (tool === 'arrow') {
          const dx = pos.x - shapeStart.x;
          const dy = pos.y - shapeStart.y;
          const len = Math.sqrt(dx*dx + dy*dy);
          const ang = Math.atan2(dy, dx);
          const headLen = Math.min(20, len * 0.3);
          ctx.moveTo(shapeStart.x, shapeStart.y);
          ctx.lineTo(pos.x, pos.y);
          ctx.moveTo(pos.x, pos.y);
          ctx.lineTo(pos.x - headLen * Math.cos(ang - 0.4), pos.y - headLen * Math.sin(ang - 0.4));
          ctx.moveTo(pos.x, pos.y);
          ctx.lineTo(pos.x - headLen * Math.cos(ang + 0.4), pos.y - headLen * Math.sin(ang + 0.4));
        } else if (tool === 'rect') {
          ctx.rect(shapeStart.x, shapeStart.y, pos.x - shapeStart.x, pos.y - shapeStart.y);
        } else if (tool === 'circle') {
          const rx = Math.abs(pos.x - shapeStart.x) / 2;
          const ry = Math.abs(pos.y - shapeStart.y) / 2;
          const cx = shapeStart.x + (pos.x - shapeStart.x) / 2;
          const cy = shapeStart.y + (pos.y - shapeStart.y) / 2;
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
        return;
      }

      if (tool === 'brush' || tool === 'shading') {
        ctx.shadowBlur = sSize * 0.5;
        ctx.shadowColor = sColor;
      }
      applyStroke(ctx, lastX, lastY, pos.x, pos.y, sColor, sSize, sOpacity);
      ctx.shadowBlur = 0;
      const sBlur = (tool === 'brush' || tool === 'shading') ? sSize * 0.5 : 0;
      currentPath.push({ x: pos.x, y: pos.y, color: sColor, size: sSize, opacity: sOpacity, blur: sBlur });
      const now = Date.now();
      if (now - lastSegmentTime > SEGMENT_THROTTLE) {
        broadcast({ type: 'segment', x1: lastBcastX, y1: lastBcastY, x2: pos.x, y2: pos.y, color: sColor, size: sSize, opacity: sOpacity });
        lastBcastX = pos.x; lastBcastY = pos.y;
        lastSegmentTime = now;
      }
      lastX = pos.x; lastY = pos.y;
    }

    function endDraw(e) {
      if (!drawing) return;
      drawing = false;
      if (['line','rect','circle','arrow'].includes(tool)) {
        const pos = e ? getPos(e) : { x: lastX, y: lastY };
        const shapeData = {
          type: 'shape',
          shape: tool,
          x1: shapeStart.x, y1: shapeStart.y,
          x2: pos.x, y2: pos.y,
          color, size, opacity
        };
        paths.push({ shape: shapeData });
        redoStack = [];
        broadcast(shapeData);
        shapeStart = null;
        return;
      }
      if (currentPath.length) {
        paths.push({ points: [...currentPath] });
        redoStack = [];
        broadcast({ type: 'path', points: [...currentPath] });
        currentPath = [];
      }
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw, { passive: false });

    function undo() {
      if (!paths.length) return;
      redoStack.push(paths.pop());
      redrawAll();
      broadcast({ type: 'undo' });
    }

    function redo() {
      if (!redoStack.length) return;
      paths.push(redoStack.pop());
      redrawAll();
      broadcast({ type: 'redo', item: paths[paths.length - 1] });
    }

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    clearBtn.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      paths = [];
      redoStack = [];
      broadcast({ type: 'clear' });
    });

    function redrawAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const item of paths) {
        if (item.points) {
          drawPath(item.points);
        } else if (item.shape) {
          drawShape(item.shape);
        }
      }
    }

    function drawPath(pts) {
      if (!pts || !pts.length) return;
      if (pts[0].blur) {
        ctx.shadowBlur = pts[0].blur;
        ctx.shadowColor = pts[0].color;
      }
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        ctx.lineTo(pts[i].x, pts[i].y);
      }
      ctx.strokeStyle = pts[0].color;
      ctx.lineWidth = pts[0].size;
      ctx.globalAlpha = pts[0].opacity || 1;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    function drawShape(s) {
      ctx.beginPath();
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.globalAlpha = s.opacity || 1;

      if (s.shape === 'line') {
        ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
      } else if (s.shape === 'arrow') {
        const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
        const len = Math.sqrt(dx*dx + dy*dy);
        const ang = Math.atan2(dy, dx);
        const headLen = Math.min(20, len * 0.3);
        ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2);
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - headLen * Math.cos(ang - 0.4), s.y2 - headLen * Math.sin(ang - 0.4));
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - headLen * Math.cos(ang + 0.4), s.y2 - headLen * Math.sin(ang + 0.4));
      } else if (s.shape === 'rect') {
        ctx.rect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
      } else if (s.shape === 'circle') {
        const rx = Math.abs(s.x2 - s.x1) / 2, ry = Math.abs(s.y2 - s.y1) / 2;
        const cx = s.x1 + (s.x2 - s.x1) / 2, cy = s.y1 + (s.y2 - s.y1) / 2;
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      }

      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'canvas-' + ROOM + '-' + Date.now() + '.png';
      link.href = canvas.toDataURL();
      link.click();
    });

    document.addEventListener('keydown', e => {
      const ctrl = e.ctrlKey || e.metaKey;

      if (ctrl && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (ctrl && e.key === 'z' && e.shiftKey) { e.preventDefault(); redo(); return; }
      if (ctrl && e.key === 's' && !e.shiftKey) { e.preventDefault(); downloadBtn.click(); return; }
      if (ctrl && e.key === 'c' && e.shiftKey) { e.preventDefault(); clearBtn.click(); return; }

      if (!ctrl && !e.target.closest('input')) {
        const map = {
          '1': 'pencil','2': 'brush','3': 'shading','4': 'marker','5': 'eraser',
          '6': 'line','7': 'rect','8': 'circle','9': 'arrow','0': 'paint',
          'e': 'eyedropper', 'E': 'eyedropper',
        };
        if (map[e.key]) { e.preventDefault(); selectTool(map[e.key]); return; }
      }
    });

    const BACKEND_URL = 'https://collab-canvas-backend-303e.onbelmo.uk';
    const backendHost = new URL(BACKEND_URL).host;
    const ws = new WebSocket('wss://' + backendHost + '/?room=' + ROOM);

    let _othersCount = 0;

    function updateStatus(connected, others) {
      statusDot.style.background = '';
      statusDot.style.boxShadow = '';
      if (!connected) {
        statusText.textContent = 'Disconnected';
        statusDot.className = 'status-dot offline';
        statusCount.textContent = '';
        return;
      }
      if (others > 0) {
        statusText.textContent = 'Connected';
        statusDot.className = 'status-dot online';
        statusCount.textContent = others === 1 ? '(1)' : `(${others})`;
      } else {
        statusText.textContent = 'Waiting';
        statusDot.className = 'status-dot offline';
        statusDot.style.background = '#eab308';
        statusDot.style.boxShadow = '0 0 6px rgba(234,179,8,.4)';
        statusCount.textContent = '';
      }
    }

    ws.onopen = () => {
      _othersCount = 0;
      updateStatus(true, _othersCount);
    };

    ws.onclose = (e) => {
      _othersCount = 0;
      if (e.code === 4000) {
        window.location.href = '/?error=notfound';
        return;
      }
      updateStatus(false, 0);
    };

    ws.onmessage = e => {
      const msg = JSON.parse(e.data);

      if (msg.type === 'segment') {
        applyStroke(ctx, msg.x1, msg.y1, msg.x2, msg.y2, msg.color, msg.size, msg.opacity);
      } else if (msg.type === 'path') {
        paths.push({ points: msg.points });
        drawPath(msg.points);
      } else if (msg.type === 'shape') {
        paths.push({ shape: msg });
        drawShape(msg);
      } else if (msg.type === 'clear') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        paths = [];
        redoStack = [];
      } else if (msg.type === 'undo') {
        if (paths.length) {
          redoStack.push(paths.pop());
          redrawAll();
        }
      } else if (msg.type === 'redo') {
        if (msg.item) {
          paths.push(msg.item);
          redrawAll();
        }
      } else if (msg.type === 'floodfill') {
        floodFill({ x: msg.x, y: msg.y }, msg.color);
      } else if (msg.type === 'sync') {
        paths = msg.paths || [];
        redrawAll();
        if (msg.bg) { canvas.style.background = msg.bg; bgPicker.value = msg.bg; }
        _othersCount = Math.max(0, msg.count - 1);
        updateStatus(true, _othersCount);
      } else if (msg.type === 'bg') {
        canvas.style.background = msg.color;
        bgPicker.value = msg.color;
      } else if (msg.type === 'users') {
        _othersCount = Math.max(0, msg.count - 1);
        updateStatus(true, _othersCount);
      }
    };

    function broadcast(data) {
      if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data));
    }

    setupCanvas();
    sizeDot.style.width = '4px';
    sizeDot.style.height = '4px';
  </script>
</body>
</html>
